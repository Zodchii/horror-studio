services:
  php:
    build: docker/php
    working_dir: /app
    volumes:
      - ./app:/app
    environment:
      DATABASE_URL: "postgresql://app:secret@postgres:5432/horror?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "amqp://guest:guest@rabbitmq:5672/%2f/stories"
    depends_on: [postgres, redis, rabbitmq]

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./app:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [php]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: horror
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports: ["5433:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["5672:5672", "15672:15672"]

volumes:
  pg_data:
